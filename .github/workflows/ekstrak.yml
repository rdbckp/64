name: Extract Local Manifest Zip

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path ke file zip di dalam repo (relatif dari root)"
        required: true
        default: "a02_local_manifest_64bit.zip"
      delete_zip_after:
        description: "Hapus file zip setelah diekstrak?"
        required: true
        type: boolean
        default: true
      commit_message:
        description: "Pesan commit"
        required: true
        default: "Extract local manifest into repo root"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cek file zip ada
        run: |
          if [ ! -f "${{ github.event.inputs.zip_path }}" ]; then
            echo "::error::File zip '${{ github.event.inputs.zip_path }}' tidak ditemukan di root repo. Upload dulu filenya sebelum run workflow ini."
            exit 1
          fi

      - name: Extract zip ke folder sementara
        run: |
          mkdir -p _extract_tmp
          unzip -q "${{ github.event.inputs.zip_path }}" -d _extract_tmp
          echo "Isi hasil ekstrak:"
          ls -la _extract_tmp

      - name: Naikin isi folder pembungkus ke root repo
        run: |
          # Kalau hasil ekstrak cuma berisi 1 folder (folder pembungkus),
          # pindahkan ISI folder itu (vendor/, device/, kernel/, dst) ke root repo.
          # Kalau hasil ekstrak sudah berupa banyak file/folder langsung, pindahkan langsung.
          cd _extract_tmp
          TOP_ITEMS=$(ls -A)
          TOP_COUNT=$(ls -A | wc -l)

          if [ "$TOP_COUNT" -eq 1 ] && [ -d "$TOP_ITEMS" ]; then
            echo "Terdeteksi folder pembungkus: $TOP_ITEMS"
            SRC="$TOP_ITEMS"
          else
            echo "Tidak ada folder pembungkus tunggal, pakai isi _extract_tmp langsung"
            SRC="."
          fi

          shopt -s dotglob nullglob
          for item in "$SRC"/*; do
            name=$(basename "$item")
            echo "Memindahkan: $name"
            rm -rf "../$name"
            mv "$item" "../$name"
          done

          cd ..
          rm -rf _extract_tmp

      - name: Hapus file zip (kalau diminta)
        if: ${{ github.event.inputs.delete_zip_after == 'true' }}
        run: rm -f "${{ github.event.inputs.zip_path }}"

      - name: Commit & push perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
          else
            git commit -m "${{ github.event.inputs.commit_message }}"
            git push
          fi

      - name: Ringkasan struktur root repo
        run: |
          echo "### Struktur root repo setelah extract" >> $GITHUB_STEP_SUMMARY
          ls -la >> $GITHUB_STEP_SUMMARY
          
