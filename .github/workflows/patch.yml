name: Patch Vendor Treble Fixes

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "Pesan commit"
        required: true
        default: "Fix vendor: add Keymaster/Gatekeeper HAL, remove QTI leftover, add VNDK props"

permissions:
  contents: write

jobs:
  patch-vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pastikan folder vendor ada
        run: |
          if [ ! -d "vendor/samsung/a02" ]; then
            echo "::error::Folder vendor/samsung/a02 tidak ditemukan. Jalankan dulu workflow extract-manifest."
            exit 1
          fi

      - name: Tulis ulang manifest.xml
        run: |
          cat > vendor/samsung/a02/manifest.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
          VINTF Manifest for Samsung Galaxy A02 64-bit Vendor Partition
          Copy to: vendor/samsung/a02/manifest.xml

          This file declares all HALs and system interfaces available from the vendor partition.
          Required for Treble compliance and GSI system image compatibility.

          target-level="30" = Android 11, VNDK version 30
          -->
          <manifest version="2.0" type="vendor" target-level="30">

            <!-- ============================================================
                 Graphics (Gralloc) HAL
                 ============================================================ -->
            <hal format="hidl">
              <n>android.hardware.graphics.allocator</n>
              <transport>hwbinder</transport>
              <version>3.0</version>
              <interface>
                <n>IAllocator</n>
                <instance>default</instance>
              </interface>
            </hal>

            <hal format="hidl">
              <n>android.hardware.graphics.composer</n>
              <transport>hwbinder</transport>
              <version>2.1</version>
              <interface>
                <n>IComposer</n>
                <instance>default</instance>
              </interface>
            </hal>

            <!-- ============================================================
                 Power Management HAL
                 ============================================================ -->
            <hal format="hidl">
              <n>android.hardware.power</n>
              <transport>hwbinder</transport>
              <version>1.2</version>
              <interface>
                <n>IPower</n>
                <instance>default</instance>
              </interface>
            </hal>

            <!-- ============================================================
                 Lights (LED/Backlight) HAL
                 ============================================================ -->
            <hal format="hidl">
              <n>android.hardware.lights</n>
              <transport>hwbinder</transport>
              <version>2.0</version>
              <interface>
                <n>ILight</n>
                <instance>default</instance>
              </interface>
            </hal>

            <!-- ============================================================
                 Vibrator HAL
                 ============================================================ -->
            <hal format="hidl">
              <n>android.hardware.vibrator</n>
              <transport>hwbinder</transport>
              <version>1.3</version>
              <interface>
                <n>IVibrator</n>
                <instance>default</instance>
              </interface>
            </hal>

            <!-- ============================================================
                 Radio (Modem/RIL) HAL
                 ============================================================ -->
            <hal format="hidl">
              <n>android.hardware.radio</n>
              <transport>hwbinder</transport>
              <version>1.5</version>
              <interface>
                <n>IRadio</n>
                <instance>slot1</instance>
              </interface>
              <interface>
                <n>ISap</n>
                <instance>slot1</instance>
              </interface>
            </hal>

            <!-- ============================================================
                 WiFi HAL
                 ============================================================ -->
            <hal format="hidl">
              <n>android.hardware.wifi</n>
              <transport>hwbinder</transport>
              <version>1.4</version>
              <interface>
                <n>IWifi</n>
                <instance>default</instance>
              </interface>
            </hal>

            <!-- ============================================================
                 Bluetooth HAL
                 ============================================================ -->
            <hal format="hidl">
              <n>android.hardware.bluetooth</n>
              <transport>hwbinder</transport>
              <version>1.1</version>
              <interface>
                <n>IBluetoothHci</n>
                <instance>default</instance>
              </interface>
            </hal>

            <!-- ============================================================
                 Thermal Management (Optional)
                 ============================================================ -->
            <hal format="hidl">
              <n>android.hardware.thermal</n>
              <transport>hwbinder</transport>
              <version>2.0</version>
              <interface>
                <n>IThermal</n>
                <instance>default</instance>
              </interface>
            </hal>

            <!-- ============================================================
                 Keymaster HAL (WAJIB - tanpa ini vold/keystore2 gagal,
                 device stuck di boot animation atau gagal decrypt /data)
                 Pakai versi software/default dulu sampai blob asli MediaTek
                 tersedia di Phase 2.
                 ============================================================ -->
            <hal format="hidl">
              <n>android.hardware.keymaster</n>
              <transport>hwbinder</transport>
              <version>4.1</version>
              <interface>
                <n>IKeymasterDevice</n>
                <instance>default</instance>
              </interface>
            </hal>

            <!-- ============================================================
                 Gatekeeper HAL (WAJIB - dipakai buat lockscreen credential
                 & tied ke Keymaster di atas)
                 ============================================================ -->
            <hal format="hidl">
              <n>android.hardware.gatekeeper</n>
              <transport>hwbinder</transport>
              <version>1.0</version>
              <interface>
                <n>IGatekeeper</n>
                <instance>default</instance>
              </interface>
            </hal>

            <!-- ============================================================
                 Audio HAL (MediaTek-specific)
                 ============================================================ -->
            <!-- NOTE: Actual audio HAL blob will be added in Phase 2
            <hal format="hidl">
              <n>android.hardware.audio</n>
              <transport>hwbinder</transport>
              <version>6.0</version>
              <interface>
                <n>IDevicesFactory</n>
                <instance>default</instance>
              </interface>
            </hal>
            -->

            <!-- ============================================================
                 Camera HAL (MediaTek-specific ISP)
                 ============================================================ -->
            <!-- NOTE: Camera ISP blob will be added in Phase 2 after GPU works
            <hal format="hidl">
              <n>android.hardware.camera.provider</n>
              <transport>hwbinder</transport>
              <version>2.4</version>
              <interface>
                <n>ICameraProvider</n>
                <instance>0</instance>
              </interface>
            </hal>
            -->

            <!-- ============================================================
                 SELinux Compatibility Information
                 ============================================================ -->
            <sepolicy>
              <version>30.0</version>
            </sepolicy>

          </manifest>
          EOF

      - name: Tulis ulang a02-vendor.mk
        run: |
          cat > vendor/samsung/a02/a02-vendor.mk << 'EOF'
          $(call inherit-product, vendor/samsung/a02/configs/board.mk)

          PRODUCT_PACKAGES += \
              libmtk_symbols \
              libmtk_vendor

          PRODUCT_PROPERTY_OVERRIDES += \
              ro.vendor.device=a02 \
              ro.vendor.model=Galaxy\ A02 \
              ro.vendor.product.device=a02 \
              ro.vendor.product.model=Galaxy\ A02

          # 64-bit Specific: VINTF Manifest Declaration (Treble)
          DEVICE_MANIFEST_FILE += vendor/samsung/a02/manifest.xml

          PRODUCT_COPY_FILES += \
              $(LOCAL_PATH)/manifest.xml:$(TARGET_COPY_OUT_VENDOR)/etc/vintf/manifest.xml
          EOF

      - name: Tulis ulang vendor.prop
        run: |
          cat > vendor/samsung/a02/vendor.prop << 'EOF'
          ro.vendor.device=a02
          ro.vendor.model=Galaxy A02
          ro.vendor.product.device=a02
          ro.vendor.product.model=Galaxy A02

          # VNDK version harus align sama target-level di manifest.xml (30 = Android 11)
          ro.vndk.version=30
          # VNDK lite: kurangin requirement full VNDK, cocok buat device low-spec
          # kayak MT6739 yang blob-nya masih campuran/belum lengkap
          ro.vndk.lite=true
          EOF

      - name: Tulis ulang BoardConfigVendor.mk
        run: |
          cat > vendor/samsung/a02/BoardConfigVendor.mk << 'EOF'
          DEVICE_VENDOR_RELEASE_CONFIG_WILDCARD := vendor/samsung/a02/configs/*.xml
          TARGET_VENDOR_PROP += vendor/samsung/a02/vendor.prop

          # NOTE: folder vendor/samsung/a02/sepolicy belum ada di repo.
          # Referensi ke folder yang gak eksis bisa bikin build gagal di tahap
          # sepolicy compile. Uncomment baris ini SETELAH folder sepolicy/ dibuat
          # (minimal ada file .te / file_contexts placeholder di dalamnya).
          # BOARD_VENDOR_SEPOLICY_DIRS += vendor/samsung/a02/sepolicy
          EOF

      - name: Ringkasan perubahan
        run: |
          echo "### File yang dipatch" >> $GITHUB_STEP_SUMMARY
          echo "- vendor/samsung/a02/manifest.xml (+ Keymaster, Gatekeeper HAL)" >> $GITHUB_STEP_SUMMARY
          echo "- vendor/samsung/a02/a02-vendor.mk (- baris QTI perfd yang salah platform)" >> $GITHUB_STEP_SUMMARY
          echo "- vendor/samsung/a02/vendor.prop (+ ro.vndk.version, ro.vndk.lite)" >> $GITHUB_STEP_SUMMARY
          echo "- vendor/samsung/a02/BoardConfigVendor.mk (sepolicy dir di-comment sementara)" >> $GITHUB_STEP_SUMMARY

      - name: Commit & push perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
          else
            git commit -m "${{ github.event.inputs.commit_message }}"
            git push
          fi
          
